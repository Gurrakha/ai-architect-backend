[project]
name = "ai-architect-backend"
version = "0.1.0"
description = "AI-powered software architecture design backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
    "google-genai",
    "alembic",
    "langchain>=1.3.15",
    "langgraph>=1.2.11",
    "langchain-google-genai>=4.3.3",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]
