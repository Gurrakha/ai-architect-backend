[project]
name = "ai-architect-backend"
version = "0.1.0"
description = "AI-powered software architecture design backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
    "google-genai",
    "alembic",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]